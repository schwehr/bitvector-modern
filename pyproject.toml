[project]
name = "bitvector-modern"
version = "0.0.7"
description = "A memory-efficient packed representation for bit arrays in pure Python"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Avinash Kak", email = "kak@purdue.edu" },
]
maintainers = [
    { name = "Avinash Kak", email = "kak@purdue.edu" },
]
requires-python = ">=3.14"
keywords = ["bit array", "bit vector", "bit string", "logical operations on bit fields"]
license = { file = "LICENSE" }
classifiers = [
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/schwehr/bitvector-modern"
Repository = "https://github.com/schwehr/bitvector-modern"
Issues = "https://github.com/schwehr/bitvector-modern/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["BitVector"]


[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "codespell>=2.4.0",
    "conventional-pre-commit>=4.4.0",
    "hypothesis>=6.0.0",
    "hypofuzz>=24.0.0",
    "mdformat>=0.7.21",
    "mdformat-gfm>=0.3.7",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.6",
    "mypy>=1.15.0",
    "pre-commit>=4.6.0",
    "pylint>=4.0.6",
    "pyrefly>=1.1.1",
    "pyright>=1.1.411",
    "pytest>=8.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.20",
    "semgrep>=1.170.0",
    "ty>=0.0.56",
    "zizmor>=1.26.1",
    "pylint-pytest>=1.1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:doctest --cov=BitVector --cov-report=term-missing --cov-report=xml"
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN001",  # missing-type-function-argument
    "ANN401",  # any-type
    "B007",  # unused-loop-control-variable
    "B912",  # map-without-explicit-strict
    "B905",  # zip-without-explicit-strict
    "C901",  # complex-structure
    "COM812",  # missing-trailing-comma
    "CPY001",  # missing-copyright-notice
    "D102",  # undocumented-public-method
    "D103",  # undocumented-public-function
    "D105",  # undocumented-magic-method
    "D203",  # incorrect-blank-line-before-class
    "D213",  # multi-line-summary-second-line
    "D401",  # non-imperative-mood
    "E501",  # line-too-long
    "EM101",  # raw-string-in-exception
    "EM102",  # f-string-in-exception
    "ERA001",  # commented-out-code
    "FBT001",  # boolean-type-hint-positional-argument
    "FURB116",  # f-string-number-format
    "INP001",  # implicit-namespace-package
    "N802",  # invalid-function-name
    "N803",  # invalid-argument-name
    "N806",  # non-lowercase-variable-in-function
    "N999",  # invalid-module-name
    "PLR0911",  # too-many-return-statements
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0917",  # too-many-positional-arguments
    "PLR2004",  # magic-value-comparison
    "PLW1641",  # eq-without-hash
    "PT012",  # pytest-raises-with-multiple-statements
    "PTH123",  # builtin-open
    "S101",  # assert
    "SIM103",  # needless-bool
    "SIM108",  # if-else-block-instead-of-if-exp
    "SLF001",  # private-member-access
    "T201",  # print
    "TC003",  # typing-only-standard-library-import
    "TC006",  # cast-type-without-quote
    "TRY003",  # raise-vanilla-args
]

[tool.coverage.run]
source = ["BitVector"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.codespell]
ignore-words-list = "astroid,bu,mis,whet,wit"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.pyright]
include = ["BitVector"]

[tool.pylint.main]
load-plugins = ["pylint_pytest"]
py-version = "3.14"

[tool.pylint.format]
max-line-length = 88

[tool.pylint.messages_control]
disable = [
    "fixme",
    "inconsistent-return-statements",
    "invalid-name",
    "line-too-long",
    "missing-function-docstring",
    "protected-access",
    "too-many-arguments",
    "too-many-branches",
    "too-many-function-args",
    "too-many-lines",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-statements",
]
